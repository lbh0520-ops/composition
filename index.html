                <button onclick="playPitchPreview('A')" class="px-3 py-2 bg-slate-100 hover:bg-emerald-100 border border-slate-300 rounded-lg text-xs sm:text-sm font-bold">라 (A)</button>
                <button onclick="playPitchPreview('B')" class="px-3 py-2 bg-slate-100 hover:bg-emerald-100 border border-slate-300 rounded-lg text-xs sm:text-sm font-bold">시 (B)</button>

    <!-- App Logic -->
    <script>
        // --- State Management ---
        const MAX_MEASURES = 4;
        const BEATS_PER_MEASURE = 4; // 4/4 Time Signature

        let currentKey = 'C'; // Key Signature: C, G, D, F, Bb
        let currentOctave = 4;
        let selectedNoteConfig = {
            duration: '4',  // '1', '2', '4', '8'
            isDotted: false,
            type: 'note'    // 'note' or 'rest'
        };

        // Pitch list for Treble Clef mapping (from top to bottom)
        // High A5 down to Middle C4 and Low B3
        const PITCH_STEPS = [
            { name: 'A', octOffset: 1, stepIndex: 12 }, // A5
            { name: 'G', octOffset: 1, stepIndex: 11 }, // G5
            { name: 'F', octOffset: 1, stepIndex: 10 }, // F5
            { name: 'E', octOffset: 1, stepIndex: 9 },  // E5
            { name: 'D', octOffset: 1, stepIndex: 8 },  // D5
            { name: 'C', octOffset: 1, stepIndex: 7 },  // C5
            { name: 'B', octOffset: 0, stepIndex: 6 },  // B4
            { name: 'A', octOffset: 0, stepIndex: 5 },  // A4
            { name: 'G', octOffset: 0, stepIndex: 4 },  // G4
            { name: 'F', octOffset: 0, stepIndex: 3 },  // F4
            { name: 'E', octOffset: 0, stepIndex: 2 },  // E4
            { name: 'D', octOffset: 0, stepIndex: 1 },  // D4
            { name: 'C', octOffset: 0, stepIndex: 0 },  // C4 (Middle C)
            { name: 'B', octOffset: -1, stepIndex: -1 } // B3
        ];

        // Key Signatures alteration definition (Sharps/Flats)
        const KEY_ALTERATIONS = {
            'C': {},
            'G': { 'F': '#' },
            'D': { 'F': '#', 'C': '#' },
            'F': { 'B': 'b' },
            'Bb': { 'B': 'b', 'E': 'b' }
        };

        // Store active notes per measure
        // Array of 4 measures. Each measure contains array of note objects
        let measuresData = [
            [], [], [], []
        ];

        // Tone.js Synth Initialization
        let synth;
        let isPlaying = false;
        let playTimeoutId = null;

        // --- DOM Elements ---
        const canvas = document.getElementById('staffCanvas');
        const ctx = canvas.getContext('2d');
        const keySelect = document.getElementById('key-select');
        const octaveSelect = document.getElementById('octave-select');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const btnClear = document.getElementById('btn-clear');
        const noteButtons = document.querySelectorAll('.note-btn');

        // --- Init Audio Synthesizer ---
        function initSynth() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.4, release: 0.8 }
                }).toDestination();
                synth.volume.value = -6; // Soft volume
            }
        }

        function playPitchPreview(noteName) {
            initSynth();
            if (Tone.context.state !== 'running') {
                Tone.start();
            }
            const fullNote = applyKeySignature(noteName, currentOctave);
            synth.triggerAttackRelease(fullNote, '8n');
        }

        // Apply Sharp/Flat based on current key signature
        function applyKeySignature(pitchName, octave) {
            const alterations = KEY_ALTERATIONS[currentKey] || {};
            let alt = alterations[pitchName] || '';
            return `${pitchName}${alt}${octave}`;
        }

        // Calculate note beat value
        function getBeatValue(durationStr, isDotted) {
            let base = 0;
            switch(durationStr) {
                case '1': base = 4; break;
                case '2': base = 2; break;
                case '4': base = 1; break;
                case '8': base = 0.5; break;
            }
            return isDotted ? base * 1.5 : base;
        }

        // --- Event Listeners ---

        // Palette Selector Click
        noteButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                noteButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                selectedNoteConfig.duration = btn.getAttribute('data-duration');
                selectedNoteConfig.isDotted = btn.getAttribute('data-dotted') === 'true';
                selectedNoteConfig.type = btn.getAttribute('data-type');
            });
        });

        // Key Signature Select Change
        keySelect.addEventListener('change', (e) => {
            currentKey = e.target.value;
            drawStaff();
        });

        // Octave Select Change
        octaveSelect.addEventListener('change', (e) => {
            currentOctave = parseInt(e.target.value, 10);
            drawStaff();
        });

        // Clear All Notes
        btnClear.addEventListener('click', () => {
            measuresData = [[], [], [], []];
            updateBeatInfo();
            drawStaff();
        });

        // Play Audio Sequence
        btnPlay.addEventListener('click', async () => {
            if (isPlaying) return;
            initSynth();
            await Tone.start();

            // Check if there are notes to play
            const totalNotes = measuresData.reduce((acc, m) => acc + m.length, 0);
            if (totalNotes === 0) {
                alert('악보에 먼저 음표를 추가해 주세요!');
                return;
            }

            isPlaying = true;
            btnPlay.classList.add('hidden');
            btnStop.classList.remove('hidden');

            const bpm = 100;
            const quarterNoteDuration = 60 / bpm; // Seconds per beat

            let timeOffset = 0;

            // Iterate measures and play
            for (let mIdx = 0; mIdx < MAX_MEASURES; mIdx++) {
                const measure = measuresData[mIdx];
                for (let nIdx = 0; nIdx < measure.length; nIdx++) {
                    const note = measure[nIdx];
                    const beats = getBeatValue(note.duration, note.isDotted);
                    const durationInSeconds = beats * quarterNoteDuration;

                    if (!isPlaying) break;

                    // Highlight current playing note
                    playTimeoutId = setTimeout(() => {
                        drawStaff(mIdx, nIdx);
                        if (note.type === 'note') {
                            const noteToPlay = applyKeySignature(note.pitch, currentOctave + note.octOffset);
                            synth.triggerAttackRelease(noteToPlay, durationInSeconds * 0.9);
                        }
                    }, timeOffset * 1000);

                    timeOffset += durationInSeconds;
                }
            }

            // Reset after finishing
            setTimeout(() => {
                stopPlayback();
            }, timeOffset * 1000 + 200);
        });

        // Stop Playback
        btnStop.addEventListener('click', () => {
            stopPlayback();
        });

        function stopPlayback() {
            isPlaying = false;
            if (playTimeoutId) clearTimeout(playTimeoutId);
            btnPlay.classList.remove('hidden');
            btnStop.classList.add('hidden');
            drawStaff();
        }

        // Handle Canvas Click (Adding/Deleting Notes)
        canvas.addEventListener('click', (e) => {
            if (isPlaying) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Staff Layout Math Parameters
            const startX = 120; // After clef & key signature
            const endX = canvas.width - 20;
            const measureWidth = (endX - startX) / MAX_MEASURES;

            // 1. Determine Measure Index
            if (clickX < startX || clickX > endX) return;
            const measureIdx = Math.floor((clickX - startX) / measureWidth);
            if (measureIdx < 0 || measureIdx >= MAX_MEASURES) return;

            // 2. Determine Y Position -> Pitch
            const lineSpacing = 16;
            const topStaffY = 70; // Top line (F5)

            // Hit test nearest pitch step
            let closestPitch = null;
            let minDistance = 999;

            PITCH_STEPS.forEach(p => {
                // F5 (stepIndex 10) is at top line y = 70
                // Each step index change corresponds to lineSpacing / 2 (8px)
                const pitchY = topStaffY + (10 - p.stepIndex) * (lineSpacing / 2);
                const dist = Math.abs(clickY - pitchY);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestPitch = { ...p, targetY: pitchY };
                }
            });

            if (!closestPitch || minDistance > 16) return; // Clicked too far

            // 3. Check for existing note deletion (Click near an existing note)
            const currentMeasureNotes = measuresData[measureIdx];
            const currentBeats = currentMeasureNotes.reduce((sum, n) => sum + getBeatValue(n.duration, n.isDotted), 0);
            
            // Note X Positions inside Measure
            let accumBeats = 0;
            let clickedNoteIndex = -1;

            for (let i = 0; i < currentMeasureNotes.length; i++) {
                const n = currentMeasureNotes[i];
                const noteBeat = getBeatValue(n.duration, n.isDotted);
                const noteX = startX + (measureIdx * measureWidth) + ((accumBeats + noteBeat / 2) / BEATS_PER_MEASURE) * measureWidth;
                
                const distanceToNote = Math.hypot(clickX - noteX, clickY - closestPitch.targetY);
                if (distanceToNote < 18) {
                    clickedNoteIndex = i;
                    break;
                }
                accumBeats += noteBeat;
            }

            // Deletion Action
            if (clickedNoteIndex !== -1) {
                currentMeasureNotes.splice(clickedNoteIndex, 1);
                updateBeatInfo();
                drawStaff();
                return;
            }

            // 4. Addition Action: Check Measure Capacity
            const newNoteBeat = getBeatValue(selectedNoteConfig.duration, selectedNoteConfig.isDotted);
            if (currentBeats + newNoteBeat > BEATS_PER_MEASURE + 0.001) {
                alert(`이 마디에는 박자가 넘칩니다! (${currentBeats}/${BEATS_PER_MEASURE} 박 채워짐)`);
                return;
            }

            // Create New Note
            const newNote = {
                pitch: closestPitch.name,
                octOffset: closestPitch.octOffset,
                stepIndex: closestPitch.stepIndex,
                duration: selectedNoteConfig.duration,
                isDotted: selectedNoteConfig.isDotted,
                type: selectedNoteConfig.type
            };

            currentMeasureNotes.push(newNote);
            
            // Audio Feedback on Placement
            if (newNote.type === 'note') {
                playPitchPreview(newNote.pitch);
            }

            updateBeatInfo();
            drawStaff();
        });

        // --- Helper: Update Beat Counters ---
        function updateBeatInfo() {
            for (let i = 0; i < MAX_MEASURES; i++) {
                const totalBeats = measuresData[i].reduce((sum, n) => sum + getBeatValue(n.duration, n.isDotted), 0);
                const infoEl = document.getElementById(`measure-${i + 1}-info`);
                infoEl.textContent = `${i + 1}마디: ${totalBeats} / 4 박`;
                
                if (totalBeats === BEATS_PER_MEASURE) {
                    infoEl.className = "bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full border border-emerald-300 font-bold";
                } else if (totalBeats > BEATS_PER_MEASURE) {
                    infoEl.className = "bg-rose-100 text-rose-800 px-3 py-1 rounded-full border border-rose-300 font-bold";
                } else {
                    infoEl.className = "bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200";
                }
            }
        }

        // --- Rendering Logic (Canvas Staff & Symbols) ---
        function drawStaff(activeMeasureIdx = -1, activeNoteIdx = -1) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const startX = 120;
            const endX = canvas.width - 20;
            const measureWidth = (endX - startX) / MAX_MEASURES;
            const topStaffY = 70;
            const lineSpacing = 16;

            // 1. Draw 5 Lines of Staff
            ctx.strokeStyle = '#334155'; // Slate 700
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const y = topStaffY + i * lineSpacing;
                ctx.beginPath();
                ctx.moveTo(30, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }

            // 2. Draw Clef (Treble Clef Symbol & Text)
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 64px serif';
            ctx.fillText('🎼', 25, topStaffY + 48);

            // 3. Draw Key Signatures (Accidentals)
            ctx.font = 'bold 22px sans-serif';
            ctx.fillStyle = '#b91c1c'; // Red-ish accent for key signatures

            const alts = KEY_ALTERATIONS[currentKey];
            let altX = 85;

            if (currentKey === 'G') {
                // Sharp on F5 (line 1, top line)
                ctx.fillText('♯', altX, topStaffY + 6);
            } else if (currentKey === 'D') {
                // Sharps on F5, C5
                ctx.fillText('♯', altX, topStaffY + 6);
                ctx.fillText('♯', altX + 12, topStaffY + 30);
            } else if (currentKey === 'F') {
                // Flat on B4 (middle line)
                ctx.fillText('♭', altX, topStaffY + 38);
            } else if (currentKey === 'Bb') {
                // Flats on B4, E5
                ctx.fillText('♭', altX, topStaffY + 38);
                ctx.fillText('♭', altX + 12, topStaffY + 14);
            }

            // 4. Draw Time Signature (4/4)
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('4', startX - 22, topStaffY + 26);
            ctx.fillText('4', startX - 22, topStaffY + 58);

            // 5. Draw Measure Bar Lines
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#475569';
            for (let i = 0; i <= MAX_MEASURES; i++) {
                const x = startX + i * measureWidth;
                ctx.beginPath();
                ctx.moveTo(x, topStaffY);
                ctx.lineTo(x, topStaffY + 4 * lineSpacing);
                ctx.stroke();

                // Final Double Bar Line
                if (i === MAX_MEASURES) {
                    ctx.beginPath();
                    ctx.moveTo(x - 5, topStaffY);
                    ctx.lineTo(x - 5, topStaffY + 4 * lineSpacing);
                    ctx.stroke();
                }
            }

            // 6. Draw Notes & Rests in each measure
            measuresData.forEach((measure, mIdx) => {
                let accumBeats = 0;

                measure.forEach((note, nIdx) => {
                    const noteBeats = getBeatValue(note.duration, note.isDotted);
                    const noteX = startX + (mIdx * measureWidth) + ((accumBeats + noteBeats / 2) / BEATS_PER_MEASURE) * measureWidth;
                    
                    const isHighlighted = (mIdx === activeMeasureIdx && nIdx === activeNoteIdx);
                    
                    if (note.type === 'rest') {
                        drawRest(noteX, topStaffY + 2 * lineSpacing, note.duration, note.isDotted, isHighlighted);
                    } else {
                        // Calculate Y position based on stepIndex
                        // F5 (stepIndex 10) -> top line (topStaffY)
                        const noteY = topStaffY + (10 - note.stepIndex) * (lineSpacing / 2);
                        drawNote(noteX, noteY, note, isHighlighted, topStaffY, lineSpacing);
                    }

                    accumBeats += noteBeats;
                });
            });
        }

        // Helper to draw single Note & Ledger Lines
        function drawNote(x, y, note, isHighlighted, topStaffY, lineSpacing) {
            ctx.save();
            ctx.fillStyle = isHighlighted ? '#16a34a' : '#0f172a';
            ctx.strokeStyle = isHighlighted ? '#16a34a' : '#0f172a';
            ctx.lineWidth = 2.5;

            // Draw Ledger Lines if out of 5-line staff bounds
            if (note.stepIndex <= 0) { // C4 and below
                for (let ly = topStaffY + 5 * lineSpacing; ly <= y + 2; ly += lineSpacing) {
                    ctx.beginPath();
                    ctx.moveTo(x - 14, ly);
                    ctx.lineTo(x + 14, ly);
                    ctx.stroke();
                }
            } else if (note.stepIndex >= 12) { // A5 and above
                for (let ly = topStaffY - lineSpacing; ly >= y - 2; ly -= lineSpacing) {
                    ctx.beginPath();
                    ctx.moveTo(x - 14, ly);
                    ctx.lineTo(x + 14, ly);
                    ctx.stroke();
                }
            }

            // Render Note Head
            const radiusX = 8;
            const radiusY = 5.5;
            const rotation = -0.25; // Slanted note head

            ctx.beginPath();
            if (note.duration === '1') {
                // Whole Note (온음표 - 넓은 빈 머리, 줄기 없음)
                ctx.ellipse(x, y, radiusX + 1.5, radiusY + 0.5, rotation, 0, 2 * Math.PI);
                ctx.lineWidth = 3.5;
                ctx.stroke();
            } else if (note.duration === '2') {
                // Half Note (2분음표 - 속이 뻥 뚫린 머리 + 굵은 테두리 + 줄기)
                ctx.ellipse(x, y, radiusX, radiusY, rotation, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff'; // 백그라운드 지우기용 흰색 채우기
                ctx.fill();
                ctx.fillStyle = isHighlighted ? '#16a34a' : '#0f172a';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Quarter / Eighth Note (4분/8분음표 - 까맣게 채워진 머리)
                ctx.ellipse(x, y, radiusX, radiusY, rotation, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Render Stem (2분, 4분, 8분 음표)
            if (note.duration !== '1') {
                const stemHeight = 36;
                const isStemUp = note.stepIndex < 6; // Stem direction heuristic

                ctx.beginPath();
                if (isStemUp) {
                    const stemX = x + radiusX - 1.5;
                    ctx.moveTo(stemX, y - 1);
                    ctx.lineTo(stemX, y - stemHeight);
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Eighth Note Flag (Up)
                    if (note.duration === '8') {
                        ctx.beginPath();
                        ctx.moveTo(stemX, y - stemHeight);
                        ctx.bezierCurveTo(stemX + 10, y - stemHeight + 8, stemX + 8, y - stemHeight + 22, stemX, y - stemHeight + 16);
                        ctx.fill();
                    }
                } else {
                    const stemX = x - radiusX + 1.5;
                    ctx.moveTo(stemX, y + 1);
                    ctx.lineTo(stemX, y + stemHeight);
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Eighth Note Flag (Down)
                    if (note.duration === '8') {
                        ctx.beginPath();
                        ctx.moveTo(stemX, y + stemHeight);
                        ctx.bezierCurveTo(stemX + 10, y + stemHeight - 8, stemX + 8, y + stemHeight - 22, stemX, y + stemHeight - 16);
                        ctx.fill();
                    }
                }
            }

            // Render Augmentation Dot (점음표 점)
            if (note.isDotted) {
                ctx.beginPath();
                ctx.arc(x + 14, y - 2, 3.2, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Pitch Label Overlay for kids' understanding
            ctx.fillStyle = isHighlighted ? '#15803d' : '#64748b';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(note.pitch, x, y > topStaffY + 30 ? y - 14 : y + 22);

            ctx.restore();
        }

        // Helper to draw Rest Symbols (정교한 캔버스 벡터 직접 드로잉)
        function drawRest(x, centerY, duration, isDotted, isHighlighted) {
            ctx.save();
            ctx.fillStyle = isHighlighted ? '#16a34a' : '#1e293b';
            ctx.strokeStyle = isHighlighted ? '#16a34a' : '#1e293b';
            ctx.lineWidth = 2.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const topStaffY = 70;
            const lineSpacing = 16;

            if (duration === '1') {
                // Whole Rest (온쉼표: 2번째 줄 아래 매달린 사각형)
                const y = topStaffY + lineSpacing;
                ctx.fillRect(x - 9, y, 18, 8);
                ctx.beginPath();
                ctx.moveTo(x - 13, y);
                ctx.lineTo(x + 13, y);
                ctx.stroke();
            } else if (duration === '2') {
                // Half Rest (2분쉼표: 3번째 줄 위에 얹힌 사각형)
                const y = topStaffY + 2 * lineSpacing;
                ctx.fillRect(x - 9, y - 8, 18, 8);
                ctx.beginPath();
                ctx.moveTo(x - 13, y);
                ctx.lineTo(x + 13, y);
                ctx.stroke();
            } else if (duration === '4') {
                // Quarter Rest (4분쉼표: 지그재그 + 꼬리 기호 렌더링)
                ctx.beginPath();
                ctx.moveTo(x + 2, centerY - 20);
                ctx.lineTo(x - 5, centerY - 8);
                ctx.lineTo(x + 4, centerY + 3);
                ctx.quadraticCurveTo(x - 6, centerY + 10, x - 2, centerY + 18);
                ctx.stroke();
            } else if (duration === '8') {
                // Eighth Rest (8분쉼표: 깃발 및 원 기호 렌더링)
                ctx.beginPath();
                ctx.arc(x - 3, centerY - 8, 3, 0, 2 * Math.PI);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x - 2, centerY - 6);
                ctx.quadraticCurveTo(x + 5, centerY - 8, x + 1, centerY - 2);
                ctx.lineTo(x - 5, centerY + 16);
                ctx.stroke();
            }

            // Dot for Dotted Rests (점쉼표 점)
            if (isDotted) {
                ctx.beginPath();
                ctx.arc(x + 14, centerY - 2, 3.2, 0, 2 * Math.PI);
                ctx.fill();
            }

            ctx.restore();
        }

        // Initial Layout Render
        window.addEventListener('load', () => {
            updateBeatInfo();
            drawStaff();
        });
    </script>
</body>
